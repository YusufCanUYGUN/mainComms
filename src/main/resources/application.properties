spring.application.name=mainCominotor
server.port=8081
server.servlet.context-path=/portakalapi
server.forward-headers-strategy=native

# MySQL Database (Production)
spring.datasource.url=jdbc:mysql://localhost:3306/opencomputersReactorDB?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=opencomputersReactorDB
spring.datasource.password=1234568.

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (disabled)
spring.h2.console.enabled=false

# Thymeleaf
spring.thymeleaf.cache=true

# Logging
logging.level.com.portakal.maincominotor=INFO
logging.file.name=logs/maincominotor.log
