spring.application.name=mainCominotor
server.port=8081
server.servlet.context-path=/portakalapi
server.forward-headers-strategy=native

# H2 Database (Development)
spring.datasource.url=jdbc:h2:file:./data/maincominotor;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Thymeleaf
spring.thymeleaf.cache=false

# Logging
logging.level.com.portakal.maincominotor=INFO
